<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Cargos</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">

		<div class="title-wrapper pt-30">
			<div class="row align-items-center">
				<div class="col-md-6">
					<div class="title">
						<h2>Cargos</h2>
					</div>
				</div>
				<div class="col-md-6">
					<div class="breadcrumb-wrapper">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a th:href="@{/index}">Página Principal</a></li>
								<li class="breadcrumb-item active" aria-current="page">Cargos</li>
							</ol>
						</nav>
					</div>
				</div>
			</div>
		</div>

		<div th:if="${errorMensaje}" class="alert alert-danger" role="alert"
			th:text="${errorMensaje}"></div>

		<div class="tables-wrapper">
			<div class="row">
				<div class="col-12">
					<div class="card-style mb-30">
						<div
							class="d-flex align-items-center justify-content-between mb-20">
							<h6 class="mb-0">Lista Cargos</h6>
							<a th:href="@{/cargo/crearCargo}"
								class="main-btn primary-btn btn-hover btn-sm"> <i
								class="lni lni-plus me-1"></i> Crear Cargo
							</a>
						</div>
						<div class="table-wrapper table-responsive">
							<table class="table">
								<thead>
									<tr>
										<th>#</th>
										<th>Nombre Cargo</th>
										<th>Descripción</th>
										<th>Acciones</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="indice: ${listacargos}">
										<td th:text="${indice.idCargo}"></td>
										<td th:text="${indice.nombreCargo}"></td>
										<td th:text="${indice.descripcion}"></td>
										<td>
											<a th:href="@{/cargo/editarCargo/{id}(id=${indice.idCargo})}"
												class="btn btn-light"><i class="lni lni-pencil"></i></a>
											<form th:action="@{/cargo/desactivar/{id}(id=${indice.idCargo})}"
												method="post" style="display: inline;">
												<button type="submit" class="btn btn-light"><i
													class="lni lni-trash-can"></i></button>
											</form>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
</body>
</html>
