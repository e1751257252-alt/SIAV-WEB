<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Crear Cargo</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">

		<div class="title-wrapper pt-30">
			<div class="row align-items-center">
				<div class="col-md-6">
					<div class="title">
						<h2>Crear Cargo</h2>
					</div>
				</div>
				<div class="col-md-6">
					<div class="breadcrumb-wrapper">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a th:href="@{/index}">Página Principal</a></li>
								<li class="breadcrumb-item"><a th:href="@{/cargo}">Cargos</a></li>
								<li class="breadcrumb-item active" aria-current="page">Crear</li>
							</ol>
						</nav>
					</div>
				</div>
			</div>
		</div>

		<div th:if="${errorMensaje}" class="alert alert-danger" role="alert"
			th:text="${errorMensaje}"></div>

		<div class="card-style mb-30">
			<form th:action="@{/cargo/guardar}" th:object="${cargo}" method="post">
				<div class="mb-3">
					<label for="nombreCargo">Nombre Cargo</label> <input type="text"
						th:field="*{nombreCargo}" class="form-control" id="nombreCargo" maxlength="50">
				</div>
				<div class="mb-3">
					<label for="descripcion">Descripción</label> <input type="text"
						th:field="*{descripcion}" class="form-control" id="descripcion" maxlength="100">
				</div>
				<div class="d-flex gap-3">
					<button type="submit" class="main-btn primary-btn btn-hover">
						<i class="lni lni-save me-1"></i> Guardar
					</button>
					<a th:href="@{/cargo}" class="btn-cancel">
						<i class="lni lni-close me-1"></i> Cancelar
					</a>
				</div>
			</form>
		</div>

	</div>
</body>
</html>
