<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/assets/images/favicon.png" type="image/png" />
    <title>Iniciar Sesión | SIAV</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
      body.login-page {
        min-height: 100vh;
        margin: 0;
        display: flex;
        font-family: inherit;
      }

      .login-brand {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        background: linear-gradient(160deg, #029adc 0%, #0279ad 100%);
        position: relative;
        overflow: hidden;
      }

      .login-brand::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
        top: -120px;
        left: -100px;
      }

      .login-brand-logo {
        background: #fff;
        border-radius: 24px;
        padding: 28px 40px;
        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08), 0 0 0 1px #eef1f8;
        margin-bottom: 28px;
        position: relative;
      }

      .login-brand img {
        max-height: 90px;
        width: auto;
        display: block;
      }

      .login-brand h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 0 0 10px;
        color: #ffffff;
        position: relative;
      }

      .login-brand p {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.85);
        max-width: 320px;
        margin: 0;
        position: relative;
      }

      .login-form-side {
        flex: 1;
        min-width: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
        padding: 40px 20px;
      }

      .login-card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border-radius: 20px;
        padding: 44px 36px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08),
          0 0 0 1px rgba(226, 232, 240, 0.6);
      }

      .login-logo-mobile {
        display: none;
        text-align: center;
        margin-bottom: 20px;
      }

      .login-logo-mobile img {
        max-height: 56px;
        width: auto;
      }

      .login-subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 0.9rem;
        margin-bottom: 28px;
      }

      .login-field {
        margin-bottom: 20px;
      }

      .login-field label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        color: #1f2937;
        margin-bottom: 8px;
      }

      .login-field .input-wrapper {
        position: relative;
      }

      .login-field input {
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 0.9rem;
        color: #1f2937;
        outline: none;
        transition: border-color 0.15s ease;
        box-sizing: border-box;
      }

      .login-field input:focus {
        border-color: #365cf5;
      }

      .login-field .toggle-password {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        color: #365cf5;
        display: flex;
        align-items: center;
      }

      .login-error {
        text-align: center;
        color: #d9534f;
        font-size: 0.85rem;
        margin-bottom: 16px;
      }

      .login-submit {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: #365cf5;
        color: #fff;
        font-weight: 600;
        padding: 12px;
        font-size: 0.95rem;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.15s ease;
      }

      .login-submit:hover {
        background: #2a49d1;
      }

      @media (max-width: 860px) {
        .login-brand {
          display: none;
        }
        .login-logo-mobile {
          display: block;
        }
      }

      .credenciales-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.55);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .credenciales-modal {
        background: #fff;
        border-radius: 18px;
        max-width: 380px;
        width: 90%;
        padding: 32px 30px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
      }

      .credenciales-modal img {
        max-height: 56px;
        width: auto;
        margin-bottom: 14px;
      }

      .credenciales-box {
        background: #f5f7fb;
        border-radius: 10px;
        padding: 14px 16px;
        text-align: left;
        margin: 18px 0 22px;
        font-size: 0.9rem;
        color: #1f2937;
      }

      .credenciales-box p {
        margin: 0 0 6px;
      }

      .credenciales-box p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body class="login-page">
    <div class="login-brand">
      <div class="login-brand-logo">
        <img src="/assets/images/logo/logo-siav.png" alt="SIAV" />
      </div>
      <h1>SIAV</h1>
      <p>Sistema de Administración de Vacaciones. Gestiona solicitudes, aprobaciones y saldos desde un solo lugar.</p>
    </div>

    <div class="login-form-side">
      <div class="login-card">
        <div class="login-logo-mobile">
          <img src="/assets/images/logo/logo-siav.png" alt="SIAV" />
        </div>
        <p class="login-subtitle">Inicia Sesión para continuar</p>

        <p th:if="${error}" th:text="${error}" class="login-error"></p>

        <form action="/login" method="post" id="loginForm">
          <div class="login-field">
            <label for="username">Usuario (Correo)</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="ejemplo@siav.com"
                autocomplete="username"
                maxlength="35"
                required
              />
            </div>
          </div>

          <div class="login-field">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                autocomplete="current-password"
                maxlength="35"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
                aria-label="Mostrar contraseña"
              >
                <svg
                  id="eyeIcon"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-submit">Iniciar Sesión</button>
        </form>
      </div>
    </div>

    <div class="credenciales-overlay" id="credencialesModal">
      <div class="credenciales-modal">
        <img src="/assets/images/logo/logo-siav.png" alt="SIAV" />
        <h4 class="mb-1">Credenciales de administrador</h4>
        <p class="login-subtitle" style="margin-bottom: 0;">Usa estos datos para ingresar y revisar el sistema.</p>
        <div class="credenciales-box">
          <p><strong>Usuario:</strong> admin@siav.com</p>
          <p><strong>Contraseña:</strong> inicio</p>
        </div>
        <button type="button" id="usarCredencialesBtn" class="login-submit">Usar estas credenciales</button>
      </div>
    </div>

    <script src="/assets/js/limite-caracteres.js"></script>
    <script>
      function togglePassword() {
        const input = document.getElementById("password");
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
      }

      document.getElementById("usarCredencialesBtn").addEventListener("click", function () {
        document.getElementById("username").value = "admin@siav.com";
        document.getElementById("password").value = "inicio";
        document.getElementById("credencialesModal").style.display = "none";
      });
    </script>
  </body>
</html>
