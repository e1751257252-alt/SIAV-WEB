<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Crear Usuario</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">

		<div class="title-wrapper pt-30">
			<div class="row align-items-center">
				<div class="col-md-6">
					<div class="title">
						<h2>Crear Usuario</h2>
					</div>
				</div>
				<div class="col-md-6">
					<div class="breadcrumb-wrapper">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a th:href="@{/index}">Página Principal</a></li>
								<li class="breadcrumb-item"><a th:href="@{/usuario}">Usuarios</a></li>
								<li class="breadcrumb-item active" aria-current="page">Crear</li>
							</ol>
						</nav>
					</div>
				</div>
			</div>
		</div>

		<div th:if="${errorMensaje}" class="alert alert-danger" role="alert"
			th:text="${errorMensaje}"></div>

		<div class="card-style mb-30">
			<form th:action="@{/usuario/guardar}" th:object="${usuario}"
				method="post">
				<div class="mb-3">
					<label for="tipoDocumento">Tipo de documento</label>
					<select th:field="*{tipoDocumento}" class="form-control"
						id="tipoDocumento">
						<option value="CEDULA">Cédula</option>
						<option value="PASAPORTE">Pasaporte</option>
					</select>
				</div>
				<div class="mb-3">
					<label for="cedula">Número de documento</label> <input type="text"
						th:field="*{cedula}" class="form-control" id="cedula" maxlength="20"
						title="Cédula: 10 dígitos numéricos. Pasaporte: 5 a 20 caracteres alfanuméricos."
						required>
				</div>
				<div class="mb-3">
					<label for="nombres">Nombres</label> <input type="text"
						th:field="*{nombres}" class="form-control" id="nombres" maxlength="50">
				</div>
				<div class="mb-3">
					<label for="apellidos">Apellidos</label> <input type="text"
						th:field="*{apellidos}" class="form-control" id="apellidos" maxlength="50">
				</div>
				<div class="mb-3">
					<label for="email">Email</label> <input type="email"
						th:field="*{email}" class="form-control" id="email" maxlength="35">
				</div>
				<div class="mb-3">
					<label for="passwordHash">Contraseña</label> <input type="password"
						th:field="*{passwordHash}" class="form-control" id="passwordHash"
						maxlength="35" required>
				</div>
				<div class="mb-3">
					<label for="idRol">Rol</label>
					<select th:field="*{idRol}" class="form-control" id="idRol">
						<option value="">Seleccione un rol</option>
						<option th:each="rol : ${listaroles}" th:value="${rol.idRol}"
							th:text="${rol.nombreRol}"></option>
					</select>
				</div>
				<div class="mb-3">
					<label for="idJefe">Jefe</label>
					<select th:field="*{idJefe}" class="form-control" id="idJefe">
						<option value="">Sin jefe</option>
						<option th:each="jefe : ${listajefes}" th:value="${jefe.idUsuario}"
							th:text="${jefe.nombres} + ' ' + ${jefe.apellidos}"></option>
					</select>
				</div>
				<div class="mb-3">
					<label for="idCargo">Cargo</label>
					<select th:field="*{idCargo}" class="form-control" id="idCargo">
						<option value="">Seleccione un cargo</option>
						<option th:each="cargo : ${listacargos}" th:value="${cargo.idCargo}"
							th:text="${cargo.nombreCargo}"></option>
					</select>
				</div>
				<div class="mb-3">
					<label for="fechaIngreso">Fecha de Ingreso</label> <input
						type="date" th:field="*{fechaIngreso}" class="form-control"
						id="fechaIngreso">
				</div>
				<div class="mb-3 form-check">
					<input type="checkbox" class="form-check-input" id="activo"
						th:field="*{activo}"> <label class="form-check-label"
						for="activo">Activo</label>
				</div>
				<div class="d-flex gap-3">
					<button type="submit" class="main-btn primary-btn btn-hover">
						<i class="lni lni-save me-1"></i> Guardar
					</button>
					<a th:href="@{/usuario}" class="btn-cancel">
						<i class="lni lni-close me-1"></i> Cancelar
					</a>
				</div>
			</form>
		</div>

		<script>
			(function limitarFechaIngreso() {
				var hoy = new Date().toISOString().split('T')[0];
				document.getElementById('fechaIngreso').setAttribute('max', hoy);
			})();
		</script>

	</div>
</body>
</html>
