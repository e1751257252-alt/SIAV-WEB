<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Reprogramar Solicitud</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">

		<div class="title-wrapper pt-30">
			<div class="row align-items-center">
				<div class="col-md-6">
					<div class="title">
						<h2>Reprogramar Solicitud</h2>
					</div>
				</div>
				<div class="col-md-6">
					<div class="breadcrumb-wrapper">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a th:href="@{/index}">Página Principal</a></li>
								<li class="breadcrumb-item"><a th:href="@{/solicitud}">Solicitudes</a></li>
								<li class="breadcrumb-item active" aria-current="page">Reprogramar</li>
							</ol>
						</nav>
					</div>
				</div>
			</div>
		</div>

		<div th:if="${errorMensaje}" class="alert alert-danger" role="alert"
			th:text="${errorMensaje}"></div>

		<div class="card-style mb-30">
			<p>
				Al reprogramar, la solicitud vuelve a estado <strong>Pendiente</strong>
				y el jefe deberá aprobarla nuevamente con las nuevas fechas. Los días
				reservados con las fechas anteriores se devuelven a tu saldo.
			</p>
			<form th:action="@{/solicitud/reprogramar/{id}(id=${solicitud.idSolicitud})}"
				method="post">
				<input type="hidden" name="origen" th:value="${origen}">
				<div class="mb-3">
					<label for="fechaInicio">Fecha Inicio</label> <input type="date"
						name="fechaInicio" th:value="${solicitud.fechaInicio}"
						class="form-control" id="fechaInicio" required>
				</div>
				<div class="mb-3">
					<label for="fechaFin">Fecha Fin</label> <input type="date"
						name="fechaFin" th:value="${solicitud.fechaFin}" class="form-control"
						id="fechaFin" required>
				</div>
				<div class="mb-3">
					<label for="diasSolicitados">Días Solicitados</label> <input
						type="number" name="diasSolicitados"
						th:value="${solicitud.diasSolicitados}" class="form-control"
						id="diasSolicitados" readonly>
				</div>
				<div class="mb-3">
					<label for="motivo">Motivo de la reprogramación</label> <input
						type="text" name="motivo" class="form-control" id="motivo"
						placeholder="Explica por qué necesitas cambiar las fechas"
						maxlength="50" required>
				</div>
				<div class="d-flex gap-3">
					<button type="submit" class="main-btn primary-btn btn-hover">
						<i class="lni lni-save me-1"></i> Reprogramar
					</button>
					<a th:href="${origen == 'equipo'} ? @{/solicitud/miEquipo} : @{/solicitud}"
						class="btn-cancel"> <i class="lni lni-close me-1"></i> Cancelar
					</a>
				</div>
			</form>
		</div>

		<script>
			(function limitarFechas() {
				var hoy = new Date();
				var maxima = new Date(hoy.getFullYear() + 2, hoy.getMonth(), hoy.getDate());
				var maximaTexto = maxima.toISOString().split('T')[0];
				document.getElementById('fechaInicio').setAttribute('max', maximaTexto);
				document.getElementById('fechaFin').setAttribute('max', maximaTexto);
			})();

			function calcularDias() {
				var inicio = document.getElementById('fechaInicio').value;
				var fin = document.getElementById('fechaFin').value;
				if (!inicio || !fin) {
					return;
				}
				var msPorDia = 24 * 60 * 60 * 1000;
				var dias = Math.round((new Date(fin) - new Date(inicio)) / msPorDia) + 1;
				document.getElementById('diasSolicitados').value = dias > 0 ? dias : 0;
			}
			document.getElementById('fechaInicio').addEventListener('change', calcularDias);
			document.getElementById('fechaFin').addEventListener('change', calcularDias);
		</script>

	</div>
</body>
</html>
