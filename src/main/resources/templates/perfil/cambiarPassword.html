<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Cambiar Contraseña</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">

		<div class="title-wrapper pt-30">
			<div class="row align-items-center">
				<div class="col-md-6">
					<div class="title">
						<h2>Cambiar Contraseña</h2>
					</div>
				</div>
			</div>
		</div>

		<div th:if="${primerIngreso}" class="alert alert-warning" role="alert">
			Este es tu primer inicio de sesión (o un administrador reinició tu
			contraseña). Debes definir una nueva contraseña antes de continuar.
		</div>

		<div th:if="${error}" class="alert alert-danger" role="alert"
			th:text="${error}"></div>

		<div class="card-style mb-30" style="max-width: 480px;">
			<form th:action="@{/perfil/cambiarPassword}" method="post">
				<input type="hidden" name="primerIngreso" th:value="${primerIngreso}">
				<div class="mb-3">
					<label for="passwordActual">Contraseña actual</label> <input
						type="password" name="passwordActual" class="form-control"
						id="passwordActual" maxlength="35" required>
				</div>
				<div class="mb-3">
					<label for="passwordNueva">Nueva contraseña</label> <input
						type="password" name="passwordNueva" class="form-control"
						id="passwordNueva" minlength="6" maxlength="35" required>
				</div>
				<div class="mb-3">
					<label for="confirmarPassword">Confirmar nueva contraseña</label>
					<input type="password" name="confirmarPassword" class="form-control"
						id="confirmarPassword" minlength="6" maxlength="35" required>
				</div>
				<div class="d-flex gap-3">
					<button type="submit" class="main-btn primary-btn btn-hover">
						<i class="lni lni-save me-1"></i> Guardar
					</button>
					<a th:unless="${primerIngreso}" th:href="@{/index}" class="btn-cancel">
						<i class="lni lni-close me-1"></i> Cancelar
					</a>
				</div>
			</form>
		</div>

	</div>
</body>
</html>
